[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cache-service"
dynamic = ["version"]
description = "FastAPI microservice that caches the results of an external string transformer."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.142",
    "uvicorn[standard]>=0.54",
    "sqlalchemy[asyncio]>=2.1",
    "aiosqlite>=0.22",
    "pydantic>=2.13",
    "pydantic-settings>=2.15",
    "httpx>=0.28",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "pytest-cov>=7.1",
    "asgi-lifespan>=2.1",
    "ruff>=0.16",
    "mypy>=2.4",
]

[project.scripts]
cache-cli = "cache_cli.main:main"

[tool.hatch.version]
path = "src/cache_service/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/cache_service", "src/cache_cli"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["--import-mode=importlib", "--strict-markers", "--strict-config"]
filterwarnings = ["error"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"

[tool.coverage.run]
source = ["cache_service", "cache_cli"]
branch = true
concurrency = ["greenlet", "thread"]
