services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      # Overrides a local-dev path from .env; inside the container the cache lives on the volume.
      CACHE_SERVICE_DATABASE_URL: sqlite+aiosqlite:////data/cache.db
    volumes:
      - cache-data:/data
    restart: unless-stopped

volumes:
  cache-data:
